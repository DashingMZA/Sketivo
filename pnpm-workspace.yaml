  - "@opennextjs/aws@4.1.16"
  - "@opennextjs/cloudflare@1.20.17"
  - "@vercel/sandbox@4.0.0"
  - ai@7.0.171
  - framer-motion@14.13.0
  - icu-minify@4.15.1
  - miniflare@5.20261110.2-beta
  - motion-dom@14.13.0
  - motion@14.13.0
  - next-intl-swc-plugin-extractor@4.15.1
  - next-intl@4.15.1
  - prettier@3.10.1
  - use-intl@4.15.1
  - wrangler@4.161.0
  - ws@8.23.0

overrides:
  mdast-util-to-markdown: 2.1.2

permissions:
  '@reduxjs/toolkit':
    skills: [modern-redux, redux-dataflow, debug-redux-toolkit-apps, migrate-to-modern-redux, adopt-rtk-query, build-slices-and-selectors, design-state-ownership, handle-side-effects]

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
