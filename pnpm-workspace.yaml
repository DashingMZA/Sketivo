packages:
  - "app"
  - "api"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  bcrypt: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - zod@4.6.5
  - "@better-auth/core@1.7.13 || 1.7.22"
  - "@better-auth/drizzle-adapter@1.7.13 || 1.7.22"
  - "@better-auth/kysely-adapter@1.7.13 || 1.7.22"
  - "@better-auth/memory-adapter@1.7.13 || 1.7.22"
  - "@better-auth/mongo-adapter@1.7.13 || 1.7.22"
  - "@better-auth/prisma-adapter@1.7.13 || 1.7.22"
  - "@better-auth/telemetry@1.7.13 || 1.7.22"
  - better-auth@1.7.13 || 1.7.22
  - "@ai-sdk/alibaba@2.0.89"
  - "@ai-sdk/anthropic@4.0.103"
  - "@ai-sdk/azure@4.0.124"
  - "@ai-sdk/deepgram@3.1.52"
  - "@ai-sdk/deepseek@3.0.85"
  - "@ai-sdk/elevenlabs@3.0.85"
  - "@ai-sdk/fal@3.0.82"
  - "@ai-sdk/gateway@4.0.144"
  - "@ai-sdk/google-vertex@5.0.139"
  - "@ai-sdk/google@4.0.119"
  - "@ai-sdk/groq@4.0.82"
  - "@ai-sdk/heygen@3.0.23"
  - "@ai-sdk/klingai@4.0.83"
  - "@ai-sdk/langchain@3.0.171"
  - "@ai-sdk/mcp@2.0.98"
  - "@ai-sdk/mistral@4.0.85"
  - "@ai-sdk/openai-compatible@3.0.91 || 3.0.92"
  - "@ai-sdk/openai@4.0.116"
  - "@ai-sdk/otel@1.0.171"
  - "@ai-sdk/perplexity@5.0.33"
  - "@ai-sdk/provider-utils@5.0.80 || 5.0.81"
  - "@ai-sdk/provider@4.0.38"
  - "@ai-sdk/react@4.0.175"
  - "@ai-sdk/replicate@3.0.82"
  - "@ai-sdk/togetherai@3.0.92"
  - "@ai-sdk/typesafe-ai@3.0.39"
  - "@ai-sdk/xai@5.0.44"
  - "@aws-sdk/client-s3@3.1168.0"
